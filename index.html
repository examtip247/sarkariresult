<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Latest Updates – ExamTip</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto;
  background:#f4f6fb;
  margin:0;
  padding:10px;
}
.feed-box{
  max-width:900px;
  margin:auto;
}
.post{
  background:#fff;
  padding:14px;
  margin-bottom:12px;
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}
.post h3{
  margin:0 0 6px;
  font-size:17px;
}
.post a{
  color:#0b57d0;
  text-decoration:none;
}
.post p{
  font-size:14px;
  color:#555;
  margin:0;
}
</style>
</head>

<body>

<div class="feed-box" id="feed"></div>

<script>
function showFeed(json){
  var html = "";
  for(var i=0;i<json.feed.entry.length;i++){
    var post = json.feed.entry[i];
    var title = post.title.$t;
    var link = "";
    for(var j=0;j<post.link.length;j++){
      if(post.link[j].rel=="alternate"){
        link = post.link[j].href;
        break;
      }
    }
    var summary = post.summary ? post.summary.$t.replace(/<[^>]+>/g,'').substring(0,120)+"..." : "";

    html += `
      <div class="post">
        <h3><a href="${link}" target="_blank">${title}</a></h3>
        <p>${summary}</p>
      </div>`;
  }
  document.getElementById("feed").innerHTML = html;
}
</script>

<script src="https://www.examtip.in/feeds/posts/default?alt=json-in-script&max-results=10000&callback=showFeed"></script>

</body>
</html>
